<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked by FocusGuard</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --accent: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161617; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #ff6b5b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 520px; padding: 32px 20px; text-align: center; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  .site { color: var(--accent); font-weight: 600; word-break: break-all; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Stay on task</h1>
  <p><span class="site" id="site">This site</span> is blocked by FocusGuard.</p>
  <p id="reason"></p>
  <p>If you really need it, open <strong>FocusGuard</strong> and tell the AI why.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("site")) document.getElementById("site").textContent = q.get("site");
  document.getElementById("reason").textContent = q.get("reason") || "";
</script>
</body>
</html>
